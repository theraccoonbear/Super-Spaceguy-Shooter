name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: TypeScript + Vite build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug checkout
        run: ls -la && echo "lockfile size:" && wc -c package-lock.json 2>/dev/null || echo "NO LOCKFILE"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
