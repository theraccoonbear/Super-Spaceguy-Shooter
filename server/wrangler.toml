name = "sss-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "sss"
# Fill in from the output of `npx wrangler d1 create sss`.
database_id = "a36fcb44-d688-4e19-8a38-141faae0667f"
migrations_dir = "migrations"

# Per-client-IP limits on the POST routes (#282). namespace_id: any positive integer unique
# within the Cloudflare account. period: 10 or 60 seconds.
[[ratelimits]]
name = "SCORES_LIMITER"
namespace_id = "28201"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "TELEMETRY_LIMITER"
namespace_id = "28202"
simple = { limit = 30, period = 60 }
