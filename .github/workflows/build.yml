name: Build

on:
  push:
    branches: [ master, 'feat/**', 'bug/**', 'fix/**' ]
    tags: [ 'v[0-9]*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  # Pinned to match local dev (CLAUDE.md) and tools/container. Bump deliberately, all three together.
  QB64PE_VERSION: v4.5.0

jobs:
  dict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate speech dict and check for missing pronunciations
        shell: bash
        run: bash tools/bake_speech_dict
      - name: Fail if speech_dict.txt is stale
        shell: bash
        run: |
          git diff --exit-code assets/speech_dict.txt || {
            echo "::error::speech_dict.txt is stale — run tools/bake_speech_dict and commit"
            exit 1
          }

  build:
    needs: dict-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Build Linux
            artifact-name: sss-linux
            artifact-path: builds/sss
            release-asset-name: sss-linux
          - os: macos-latest
            name: Build macOS
            artifact-name: sss-macos
            artifact-path: builds/sss
            release-asset-name: sss-macos
          - os: windows-latest
            name: Build Windows
            artifact-name: sss-windows
            artifact-path: builds/sss.exe
            release-asset-name: sss-windows.exe

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QB64-PE
        uses: ./.github/actions/setup-qb64pe
        with:
          qb64pe-version: ${{ env.QB64PE_VERSION }}

      # tools/dev run must hand the container the display, GPU and controllers (#223).
      - name: Check tools/dev run passes devices into the container
        if: runner.os == 'Linux'
        run: bash tests/tools_dev_test.sh

      # One worker per vCPU: CI runners' vCPUs aren't desktop hyperthreads, so the
      # script's half-the-CPUs default would leave them idle.
      - name: Build and run all tests
        shell: bash
        run: |
          CPUS="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          echo "vCPUs: $CPUS"
          QB64_TEST_JOBS="$CPUS" QB64_BIN_DIR=qb64pe-bin bash .github/scripts/qb64test.sh

      - name: Build sss.bas
        shell: bash
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_KEY: ${{ secrets.DB_KEY }}
        run: QB64_BIN_DIR=qb64pe-bin bash .github/scripts/qb64build.sh

      - name: Smoke test -- --version
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ] && command -v xvfb-run &>/dev/null; then
            OUT=$(xvfb-run -a "${{ matrix.artifact-path }}" --version)
          else
            OUT=$("${{ matrix.artifact-path }}" --version)
          fi
          echo "$OUT"
          OUT="${OUT//$'\r'/}"
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "$OUT" | grep -qE "Super Spaceguy Shooter ${BASE_VERSION}(-dev\+[0-9a-f]+(-dirty)?)?$" || {
            echo "::error::--version smoke test failed: expected a version starting with '${BASE_VERSION}', got: $OUT"
            exit 1
          }

      # Golden-screenshot render tests (tests/render/). Linux only: only this job has Xvfb,
      # and the goldens come from the same Ubuntu toolchain (tools/dev); another OS's
      # compiler and libm can round the rasterizer's float math differently.
      - name: Render tests
        if: runner.os == 'Linux'
        shell: bash
        run: QB64_BIN_DIR=qb64pe-bin bash tests/render/run.sh --no-build

      - name: Upload render test screenshots and diffs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: render-test-results
          path: tests/render/out/
          if-no-files-found: ignore

      - name: Dump compile log on failure
        if: failure()
        shell: bash
        run: cat qb64pe-bin/internal/temp/compilelog.txt 2>/dev/null || echo "compilelog.txt not found"

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp ${{ matrix.artifact-path }} ${{ matrix.release-asset-name }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-name }}
          path: ${{ matrix.release-asset-name }}

  # Full-playthrough smoke test (#100). Its own job so it runs alongside the build matrix
  # instead of adding minutes to Build Linux; Linux only, as it needs Xvfb. The sss it
  # tests is built with no telemetry credentials: the scripted run OKs the data notice,
  # so a build with them would send telemetry and a leaderboard score.
  playthrough:
    needs: dict-check
    name: Playthrough smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QB64-PE
        uses: ./.github/actions/setup-qb64pe
        with:
          qb64pe-version: ${{ env.QB64PE_VERSION }}

      - name: Build sss.bas (no telemetry credentials)
        shell: bash
        run: QB64_BIN_DIR=qb64pe-bin bash .github/scripts/qb64build.sh

      - name: Playthrough smoke test (tests/playthrough)
        timeout-minutes: 20
        shell: bash
        run: tests/playthrough/run.sh

      - name: Dump compile log on failure
        if: failure()
        shell: bash
        run: cat qb64pe-bin/internal/temp/compilelog.txt 2>/dev/null || echo "compilelog.txt not found"

      - name: Upload playthrough logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-logs
          path: builds/playthrough/
          if-no-files-found: ignore

  gate:
    name: All checks pass
    needs: [dict-check, build, playthrough]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require all jobs to succeed
        run: |
          fail=0
          [[ "${{ needs.dict-check.result }}" != "success" ]] && echo "FAIL dict-check: ${{ needs.dict-check.result }}" && fail=1
          [[ "${{ needs.build.result }}"      != "success" ]] && echo "FAIL build:      ${{ needs.build.result }}"      && fail=1
          [[ "${{ needs.playthrough.result }}" != "success" ]] && echo "FAIL playthrough: ${{ needs.playthrough.result }}" && fail=1
          [[ $fail -eq 0 ]] && echo "All checks passed." || exit 1

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
