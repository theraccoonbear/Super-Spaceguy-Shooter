name: Build

# One run per PR push (#294): branch pushes only build master and tags; a PR's own
# pull_request run covers its branch.
on:
  push:
    branches: [ master ]
    tags: [ 'v[0-9]*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# A newer push to a PR cancels its superseded run. master, tag and dispatch runs each
# get their own group, so none is cancelled or left pending behind another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.head_ref) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to match local dev (CLAUDE.md), tools/container and determinism.yml. Bump deliberately, all together.
  QB64PE_VERSION: v4.5.0

jobs:
  # Which halves of CI this change needs (#341). game: everything but server/ and docs;
  # server: server/ and the leaderboard fixture its tests read. .github/ changes, pushes
  # with no usable "before" commit, tags and dispatches run everything. build-matrix:
  # Build Linux (the credentialed binary) only on runs that upload binaries (master,
  # tags, dispatch).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.filter.outputs.game }}
      server: ${{ steps.filter.outputs.server }}
      build-matrix: ${{ steps.filter.outputs.build-matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=1 files=""
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the PR merged into master; its first parent is master
            files="$(git diff --name-only HEAD^1 HEAD)" && all=0
          elif [ "$EVENT" = push ] && [[ "$REF" == refs/heads/* ]] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD)" && all=0
          fi
          game=0 server=0
          while IFS= read -r f; do
            case "$f" in
              '') ;;
              .github/*) game=1 server=1 ;;
              tests/input/leaderboard.json) game=1 server=1 ;;
              server/*) server=1 ;;
              assets/*) game=1 ;;
              docs/*|*.md) ;;
              *) game=1 ;;
            esac
          done <<< "$files"
          [ "$all" = 1 ] && game=1 server=1
          echo "changed files:"; printf '  %s\n' $files
          tf() { [ "$1" = 1 ] && echo true || echo false; }
          echo "game=$(tf $game)" >> "$GITHUB_OUTPUT"
          echo "server=$(tf $server)" >> "$GITHUB_OUTPUT"
          echo "game=$(tf $game) server=$(tf $server)"
          mac='{"os":"macos-latest","name":"Build macOS","artifact-name":"sss-macos","artifact-path":"builds/sss","release-asset-name":"sss-macos"}'
          win='{"os":"windows-latest","name":"Build Windows","artifact-name":"sss-windows","artifact-path":"builds/sss.exe","release-asset-name":"sss-windows.exe"}'
          lnx='{"os":"ubuntu-22.04","cache-suffix":"-ubuntu2204","name":"Build Linux","artifact-name":"sss-linux","artifact-path":"builds/sss","release-asset-name":"sss-linux"}'
          # PRs: build-dev covers Linux, so only master, tags and dispatch build the credentialed binary
          if [ "$EVENT" = pull_request ] || { [ "$EVENT" = push ] && [ "$REF" != refs/heads/master ] && [[ "$REF" != refs/tags/v* ]]; }; then
            echo "build-matrix={\"include\":[$mac,$win]}" >> "$GITHUB_OUTPUT"
          else
            echo "build-matrix={\"include\":[$lnx,$mac,$win]}" >> "$GITHUB_OUTPUT"
          fi

  dict-check:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate speech dict and check for missing pronunciations
        shell: bash
        run: bash tools/bake_speech_dict
      - name: Fail if speech_dict.txt is stale
        shell: bash
        run: |
          git diff --exit-code assets/speech_dict.txt || {
            echo "::error::speech_dict.txt is stale — run tools/bake_speech_dict and commit"
            exit 1
          }

  # The QB64-PE test suite, apart from the game builds so neither waits on the other.
  # Windows is the slowest, so it runs in two shards.
  test:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Test Linux
          - os: macos-latest
            name: Test macOS
          - os: windows-latest
            name: Test Windows (1/2)
            shard: 1/2
          - os: windows-latest
            name: Test Windows (2/2)
            shard: 2/2

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QB64-PE
        uses: ./.github/actions/setup-qb64pe
        with:
          qb64pe-version: ${{ env.QB64PE_VERSION }}

      # tools/dev run must hand the container the display, GPU and controllers (#223);
      # tools/dev record must parse its options and refuse a build with DB_URL (#321).
      - name: Check tools/dev run and record container commands
        if: runner.os == 'Linux'
        run: bash tests/tools_dev_test.sh

      # One worker per vCPU: CI runners' vCPUs aren't desktop hyperthreads, so the
      # script's half-the-CPUs default would leave them idle.
      - name: Build and run all tests
        shell: bash
        env:
          QB64_TEST_SHARD: ${{ matrix.shard }}
        run: |
          CPUS="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          echo "vCPUs: $CPUS"
          QB64_TEST_JOBS="$CPUS" QB64_BIN_DIR=qb64pe-bin bash .github/scripts/qb64test.sh

  build:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build-matrix) }}

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # no tests here: on a cache miss, leave saving the QB64-PE cache to the test jobs (#270)
      - name: Set up QB64-PE
        uses: ./.github/actions/setup-qb64pe
        with:
          qb64pe-version: ${{ env.QB64PE_VERSION }}
          save-cache: 'false'
          cache-suffix: ${{ matrix.cache-suffix }}

      # A v* tag builds the release binaries (no dev-only flags, #275); everything else is a dev build.
      - name: Build sss.bas
        shell: bash
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_KEY: ${{ secrets.DB_KEY }}
          SSS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: QB64_BIN_DIR=qb64pe-bin bash .github/scripts/qb64build.sh

      - name: Release build smoke test
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        run: bash tests/release_build_test.sh builds/sss

      - name: Smoke test -- --version
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ] && command -v xvfb-run &>/dev/null; then
            OUT=$(xvfb-run -a "${{ matrix.artifact-path }}" --version)
          else
            OUT=$("${{ matrix.artifact-path }}" --version)
          fi
          echo "$OUT"
          if [ "${{ runner.os }}" != "Windows" ] && [[ "$OUT" == *$'\r'* ]]; then
            echo "::error::--version output contains a carriage return on ${{ runner.os }} (#252)"
            exit 1
          fi
          OUT="${OUT//$'\r'/}"
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          # A tag build must print exactly the tag's version (v0.1.0-rc1 -> 0.1.0-rc1), and
          # the tag must be a release of VERSION. Taken from the ref, not git, so a checkout
          # that lost the tag (make-version.sh falls back to VERSION) fails here.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION%%-*}" != "$BASE_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match VERSION ($BASE_VERSION)"
              exit 1
            fi
            if [ "$OUT" != "Super Spaceguy Shooter $TAG_VERSION" ]; then
              echo "::error::--version smoke test failed: expected 'Super Spaceguy Shooter $TAG_VERSION', got: $OUT"
              exit 1
            fi
            exit 0
          fi
          echo "$OUT" | grep -qE "Super Spaceguy Shooter ${BASE_VERSION}(-dev\+[0-9a-f]+(-dirty)?)?$" || {
            echo "::error::--version smoke test failed: expected a version starting with '${BASE_VERSION}', got: $OUT"
            exit 1
          }

      # Fedora's libcurl has no symbol versions, so a CURL_OPENSSL_4 requirement makes its loader warn (#303)
      - name: Check the binary needs no libcurl symbol versions
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/curl_symver_check.sh "${{ matrix.artifact-path }}"

      # The Linux release is built on ubuntu-22.04 (glibc 2.35, binary needs 2.34) so it runs on older distros (#306)
      - name: Check the binary's glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/glibc_floor_check.sh "${{ matrix.artifact-path }}"

      - name: Dump compile log on failure
        if: failure()
        shell: bash
        run: cat qb64pe-bin/internal/temp/compilelog.txt 2>/dev/null || echo "compilelog.txt not found"

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cp ${{ matrix.artifact-path }} ${{ matrix.release-asset-name }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-name }}
          path: ${{ matrix.release-asset-name }}

  # The one Linux dev binary with no credentials, shared by render and playthrough. It
  # stands in for Build Linux on PRs, so the --version and libcurl checks run on it.
  build-dev:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    name: Build Linux dev binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QB64-PE
        uses: ./.github/actions/setup-qb64pe
        with:
          qb64pe-version: ${{ env.QB64PE_VERSION }}

      - name: Build sss.bas (no telemetry credentials)
        shell: bash
        run: QB64_BIN_DIR=qb64pe-bin bash .github/scripts/qb64build.sh

      - name: Smoke test -- --version
        shell: bash
        run: |
          OUT="$(xvfb-run -a builds/sss --version)"
          echo "$OUT"
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$OUT" != *$'\r'* ]] && echo "$OUT" | grep -qE "Super Spaceguy Shooter ${BASE_VERSION}(-dev\+[0-9a-f]+(-dirty)?)?$" || {
            echo "::error::--version smoke test failed: expected a version starting with '${BASE_VERSION}', got: $OUT"
            exit 1
          }

      - name: Check the binary needs no libcurl symbol versions
        shell: bash
        run: bash .github/scripts/curl_symver_check.sh builds/sss

      # tar keeps the exec bit, which upload-artifact drops
      - name: Pack binary
        shell: bash
        run: tar cf sss.tar -C builds sss

      - uses: actions/upload-artifact@v4
        with:
          name: sss-linux-dev
          path: sss.tar
          retention-days: 3

      - name: Dump compile log on failure
        if: failure()
        shell: bash
        run: cat qb64pe-bin/internal/temp/compilelog.txt 2>/dev/null || echo "compilelog.txt not found"

  # Full-playthrough smoke test (#100). Its own job so it runs alongside the build matrix
  # instead of adding minutes to Build Linux; Linux only, as it needs Xvfb. The sss it
  # tests is the shared build-dev binary, built with no telemetry credentials: the scripted
  # run OKs the data notice, so a build with them would send telemetry and a leaderboard score.
  playthrough:
    needs: build-dev
    name: Playthrough smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-deps

      - uses: actions/download-artifact@v4
        with:
          name: sss-linux-dev

      - name: Unpack binary
        shell: bash
        run: mkdir -p builds && tar xf sss.tar -C builds

      - name: Playthrough smoke test (tests/playthrough)
        timeout-minutes: 20
        shell: bash
        run: tests/playthrough/run.sh

      - name: Upload playthrough logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough-logs
          path: builds/playthrough/
          if-no-files-found: ignore

  # A release build (#275) on every push and PR, so a dev-only flag leaking into
  # release binaries fails before a tag does. Tests, render and playthrough keep the
  # dev build: they need --scene, --input-script, --frames, --seed, --screenshot-at.
  release-smoke:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    name: Release build smoke test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # ubuntu-22.04, not latest: the Linux release binary is built on glibc 2.35 (#306),
      # with its own QB64-PE cache since the cached libqb objects embed the build's glibc
      - name: Set up QB64-PE
        uses: ./.github/actions/setup-qb64pe
        with:
          qb64pe-version: ${{ env.QB64PE_VERSION }}
          cache-suffix: -ubuntu2204

      # Rehearses the tag path on every push and PR: a local, never-pushed rc tag makes
      # make-version.sh embed the tag's version, and release_build_test.sh expects it.
      - name: Tag HEAD locally as a release candidate
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          git tag "v$(tr -d '[:space:]' < VERSION)-rc0"
          git describe --tags --exact-match --match 'v[0-9]*' HEAD

      - name: Build sss.bas (release)
        shell: bash
        run: QB64_BIN_DIR=qb64pe-bin bash .github/scripts/qb64build.sh --release

      - name: Release build smoke test
        shell: bash
        run: bash tests/release_build_test.sh builds/sss

      - name: Check the binary's glibc floor
        shell: bash
        run: bash .github/scripts/glibc_floor_check.sh builds/sss

      - name: Dump compile log on failure
        if: failure()
        shell: bash
        run: cat qb64pe-bin/internal/temp/compilelog.txt 2>/dev/null || echo "compilelog.txt not found"

  # Golden-screenshot render tests (tests/render/). Its own job so it runs alongside the
  # build matrix instead of adding minutes to Build Linux. Linux only: it needs Xvfb, and
  # the goldens come from the same Ubuntu toolchain (tools/dev); another OS's compiler
  # and libm can round the rasterizer's float math differently. It still sets up
  # QB64-PE because run.sh compiles tools/imgdiff.bas.
  render:
    needs: build-dev
    name: Render tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QB64-PE
        uses: ./.github/actions/setup-qb64pe
        with:
          qb64pe-version: ${{ env.QB64PE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: sss-linux-dev

      - name: Unpack binary
        shell: bash
        run: mkdir -p builds && tar xf sss.tar -C builds

      - name: Render tests
        shell: bash
        run: QB64_BIN_DIR=qb64pe-bin bash tests/render/run.sh --no-build

      - name: Dump compile log on failure
        if: failure()
        shell: bash
        run: cat qb64pe-bin/internal/temp/compilelog.txt 2>/dev/null || echo "compilelog.txt not found"

      # run.sh writes out/FAILED whenever a scene fails, including non-gating gameplay scenes
      # that leave the job green
      - name: Upload render test screenshots and diffs
        if: failure() || hashFiles('tests/render/out/FAILED') != ''
        uses: actions/upload-artifact@v4
        with:
          name: render-test-results
          path: tests/render/out/
          if-no-files-found: ignore

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache server/node_modules
        id: cache_server_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-node-modules-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - name: Install
        if: steps.cache_server_modules.outputs.cache-hit != 'true'
        working-directory: server
        run: npm ci
      - name: Test
        working-directory: server
        run: npm test

  deploy-server:
    name: Deploy server
    needs: server
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect server/ changes
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$(git diff --name-only "$before" "${{ github.sha }}" -- server/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under server/; skipping deploy."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 24
      - name: Cache server/node_modules
        if: steps.changes.outputs.changed == 'true'
        id: cache_server_modules
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-node-modules-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - name: Install
        if: steps.changes.outputs.changed == 'true' && steps.cache_server_modules.outputs.cache-hit != 'true'
        working-directory: server
        run: npm ci
      - name: Check Cloudflare secret
        if: steps.changes.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
      - name: Apply D1 migrations
        if: steps.changes.outputs.changed == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply sss --remote
      - name: Deploy Worker
        if: steps.changes.outputs.changed == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy


  gate:
    name: All checks pass
    # playthrough runs alongside but doesn't gate PRs; a failure shows as its own red check.
    # A job the change filter skipped on purpose counts as passed; any other result fails.
    needs: [changes, dict-check, test, build, build-dev, release-smoke, render, server]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require all jobs to succeed
        shell: bash
        env:
          GAME: ${{ needs.changes.outputs.game }}
          SERVER: ${{ needs.changes.outputs.server }}
        run: |
          fail=0
          # <job> <result> <whether the change filter wanted it to run>
          check() {
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = false ]; }; then
              printf 'ok   %-14s %s\n' "$1" "$2"
            else
              printf 'FAIL %-14s %s\n' "$1" "$2"; fail=1
            fi
          }
          check changes       "${{ needs.changes.result }}"       true
          check dict-check    "${{ needs.dict-check.result }}"    "$GAME"
          check test          "${{ needs.test.result }}"          "$GAME"
          check build         "${{ needs.build.result }}"         "$GAME"
          check build-dev     "${{ needs.build-dev.result }}"     "$GAME"
          check release-smoke "${{ needs.release-smoke.result }}" "$GAME"
          check render        "${{ needs.render.result }}"        "$GAME"
          check server        "${{ needs.server.result }}"        "$SERVER"
          [[ $fail -eq 0 ]] && echo "All checks passed." || exit 1

  # gate runs if: always() but fails unless every gating job succeeded, so a red
  # render or server check on a tag blocks the release.
  release:
    needs: [gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # The repo's default GITHUB_TOKEN is read-only; gh release create needs write.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Check release assets
        shell: bash
        run: |
          ls -l release-assets
          for f in sss-linux sss-macos sss-windows.exe; do
            [ -s "release-assets/$f" ] || { echo "::error::missing release asset $f"; exit 1; }
          done
          [ "$(ls release-assets | wc -l)" -eq 3 ] || { echo "::error::expected exactly 3 release assets"; exit 1; }

      # A tag with a '-' (v0.1.0-rc1) is a pre-release, never "latest".
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=()
          [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$TAG" \
            release-assets/* \
            --title "$TAG" \
            --generate-notes \
            "${PRERELEASE[@]}"
