; ---------------------------------------------------------------
; Credits ($) and the upgrade dock (#268). Numbers, read by
; src/gameplay/upgrades.bas (UPG_Load); not used in gametext.txt.
; ---------------------------------------------------------------
; Credits earned (separate from score; spending never lowers score)
cr_kill=25
cr_boss=600
cr_stage=200
cr_ast_near=20
cr_ast_kill=20
cr_ast_survive=400
;
; Economy, first pass (#90 tunes it). Only credits earned before the last dock
; (after stage 5) can be spent. A strong run of stages 1-5 earns about:
;   kills        50 x 25  = 1250   (stage triggers 10+15+10+15 kills; stage 4 is the asteroid field)
;   bosses        2 x 600 = 1200   (stage 3 and stage 5 bosses)
;   stage clears  5 x 200 = 1000
;   asteroids    ~15 near misses x 20 + 400 for surviving = 700
;   total                 ~ 4150
; Every level of every upgrade below costs 3960 in all (95%), hull repairs not counted.
; The measured full god-mode run (71 kills, 3 bosses, 6 stages) earns ~6000 incl. stage 6.
;
; Upgrades: upg_<id>=<name[,name for later levels]>|<price per level>|<effect A, level 0..max>|<effect B, level 0..max>
;   laser   effect A = laser max, B = laser regen per frame
;   cannon  A = shots per trigger pull (2 = parallel pair), B = spread (sideways speed / shot speed)
;   rapid   A = seconds between shots
;   shield  A = shield max
;   regen   A = frames per shield point regained (0 = none), B = frames without a hit before it starts
;   armour  A = collision / asteroid damage multiplier
;   nova    A = charges per stage (refilled at every dock)
;   thrust  A = max sideways speed per frame
;   roll    A = roll cooldown in frames (0 = locked)
;   tractor A = pull range (sideways units), B = pull per frame (fraction of the gap)
;   fuel    A = fuel tank capacity
;   repair  one shield refill per dock visit
upg_laser=LASER CAPACITOR|80,150,250|100,125,150,180|0.30,0.36,0.42,0.50
upg_cannon=TWIN CANNONS,SPREAD SHOT|200,350|1,2,3|0,0,0.08
upg_rapid=RAPID FIRE|100,200|0.18,0.14,0.10
upg_shield=SHIELD CAPACITY|80,150,250|100,125,150,180
upg_regen=SHIELD REGEN|120,220|0,20,10|0,180,120
upg_armour=HULL ARMOUR|100,200|1,0.75,0.5
upg_nova=NOVA PULSE|150,200,300|0,1,2,3
upg_thrust=THRUSTERS|60,120|0.12,0.15,0.18
upg_roll=EVASIVE ROLL|150,200|0,150,90
upg_tractor=TRACTOR BEAM|60,120|0,10,18|0,0.05,0.09
upg_fuel=FUEL TANK|50,100|100,130,160
upg_repair=HULL REPAIR|50
; Nova pulse: blast radius (world units around the ship) and the damage a boss takes
nova_radius=24
nova_boss_dmg=3
; Evasive roll: dash length in frames and sideways distance per frame
roll_frames=20
roll_speed=0.32
