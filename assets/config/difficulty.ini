; difficulty.ini  --  difficulty levels (#102). Parsed by CFG_Parse$ (src/sys/config.bas); read by
; src/gameplay/difficulty.bas. Format: key=value, no spaces around =, ; starts a comment.
;
; A level is picked in Settings (DIFFICULTY row, LEFT / RIGHT steps through `levels` in order),
; saved in sss_settings.ini, and locked for a run when it starts: a change applies to the next run.
; Not to be confused with the in-run ramp (diffScale, dims.bas DIFF_RAMP_DURATION), which still
; tightens every run as it goes, at every level.
;
;   levels           the levels, in the order Settings steps through them (any number)
;   default          the level a fresh install plays, and the one the title doesn't mention
;   <level>_name     what Settings and the title call it (default: the level in capitals)
;   <level>_tag      short mark for the leaderboard (empty: none)
;   <level>_<knob>   multiplier on that knob at that level; a missing knob is 1. A value must be
;                    above 0, and an unknown key fails the load.
levels=easy,normal,hard
default=normal
easy_name=EASY
easy_tag=E
normal_name=NORMAL
normal_tag=
hard_name=HARD
hard_tag=H
;
; Knobs. Difficulty changes pacing (Normal or faster), aggression and the economy, never how many enemies a stage
; has (kill targets and formation sizes stay). Above 1 means more of the thing named.
;   wave_gap         frames between regular waves (waves.ini wave_gap); also the dock's estimate
;                    of seconds per kill (economy.ini fuel_kill_secs), which follows the cadence
;   wave_open_gap    frames between a stage's opening waves (waves.ini wave_open_gap)
;   wave_first       frames to a stage's first wave (waves.ini wave_first)
;   enemy_fire       enemy fighters' time between shots, and before their first
;   enemy_lead       how much of the perfect lead enemy shots aim with (never past perfect)
;   enemy_homing     how hard fighters close on the ship, and their strafe bursts
;   enemy_speed      how fast fighters fly in
;   dmg_taken        shield damage from enemy and boss lasers, ship and boss collisions, the
;                    boss's spores and cuts. Asteroids stay fatal.
;   boss_hp          boss hit points (and the dock's estimate of a boss fight's length)
;   boss_fire        the boss's time between attacks
;   fuel_price       fuel's base price per unit (the per-dock surcharge fuel_mult stays as is)
;   shield_price     shields' price per point
;   fuel_burn        fuel burned in flight, and in the dock's estimate of the next jump
;   credits          credits earned (kills, bosses, stage clears, the asteroid field). The
;                    end-of-run cash-in rate stays: score is score.
;   upgrade_price    upgrade prices at the dock
;   pup_chance       chance a wave brings a power-up
;   pup_fuel         fuel a fuel pickup gives
;   pup_shield       shield a shield pickup gives
;   ast_interval     time between asteroid patterns in the asteroid field (the field lasts as long)
;
; Normal has no knobs: it plays exactly as the other config files say.
;
; No level paces its waves slower than Normal (wave_gap, wave_open_gap, wave_first at most 1).
; A stage ends at a kill count every level shares, and fuel burns by time, so slower waves make
; a stage longer and cost fuel: an easier level that paced slower ran dry where Hard didn't.
; Easy is easier through its fighters, damage, bosses and prices instead. difficulty_test checks it.
easy_enemy_fire=1.35
easy_enemy_lead=0.6
easy_enemy_homing=0.7
easy_enemy_speed=0.9
easy_dmg_taken=0.75
easy_boss_hp=0.7
easy_boss_fire=1.3
easy_fuel_price=0.75
easy_shield_price=0.75
easy_fuel_burn=0.9
easy_credits=1.2
easy_upgrade_price=0.85
easy_pup_chance=1.3
easy_pup_fuel=1.33
easy_pup_shield=1.33
easy_ast_interval=1.25
;
hard_wave_gap=0.85
hard_wave_open_gap=0.9
hard_wave_first=0.75
hard_enemy_fire=0.8
hard_enemy_lead=1.25
hard_enemy_homing=1.25
hard_enemy_speed=1.1
hard_dmg_taken=1.25
hard_boss_hp=1.3
hard_boss_fire=0.85
hard_fuel_price=1.25
hard_shield_price=1.25
hard_fuel_burn=1.1
hard_credits=0.85
hard_upgrade_price=1.15
hard_pup_chance=0.85
hard_pup_fuel=1.0
hard_pup_shield=0.9
hard_ast_interval=0.85
