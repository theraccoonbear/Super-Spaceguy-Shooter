; enemies.ini  --  how each enemy type attacks (#136). Parsed by CFG_Parse$ (src/sys/config.bas);
; read by src/gameplay/enemyatk.bas, used by enemy.bas. Format: key=value, no spaces around =,
; ; starts a comment. A missing key means the solo baseline. Keys are <type>_<value>:
;
; Types: solo, arrow, hline, vcol, pincer, vwedge (the six formation types; vcol and solo
; keep the baseline attack).
;   shots     bullets per volley (1 to 5)
;   spread    degrees between neighbouring bullets of a volley, sideways (0 to 45)
;   speed     bullet speed, times the baseline (0.2 to 3)
;   cool      time between volleys, times the baseline (0.2 to 5); above 1 fires less often
;   lead      how much of a perfect intercept the aim applies, times the baseline (0 to 2)
;   homing    degrees a bullet may turn toward the ship each frame (0 to 5); 0 flies straight
;   home_stop distance ahead of the ship, in world units, inside which a homing bullet stops
;             turning and flies straight, so a last-moment dodge works (0 to 20)
;
; Balance: incoming damage per level stays near the baseline because shots per volley and the
; volley rate trade off (pincer fires 3 shots 1.4x as far apart; arrow and hline fire more
; often but aim worse; vwedge bullets are slower). tests/enemy_attack_test.bas guards the
; shipped numbers. Live tuning: --enemy-dev (docs/cli.md).
