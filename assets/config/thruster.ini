; thruster.ini  --  the player's engine sound (#402). Parsed by CFG_Parse$ (src/sys/config.bas);
; read by src/audio/thruster.bas into the thr* values of src/audio/snd.bas. Format: key=value,
; no spaces around =, ; starts a comment. Times are in ms and frequencies in Hz, so the sound
; is the same at any sound-device rate. Tune by ear with `--thruster-dev` (docs/cli.md), then
; copy the values shown on its readout back here.
;
; Thrust demand (0..1) is made each frame from the ship's speed and how fast that speed is
; changing, then smoothed: it rises over attack_ms and falls back over release_ms.
attack_ms=60
release_ms=380
speed_weight=0.55
accel_weight=0.75

; The tonal hum: pitch (Hz) and level at idle (demand 0) and at full demand (1).
hum_pitch_min=75
hum_pitch_max=150
hum_amp_idle=0.07
hum_amp_max=0.20

; The rumble: low-passed noise under the hum. Level is 0..1 at full demand, rumble_idle is the
; share of it that stays at idle; the low-pass cutoff (Hz) opens with demand.
rumble_level=0.8
rumble_idle=0.2
cutoff_min=70
cutoff_max=340

; A short burst of extra rumble on a sudden direction change. The threshold is the change in
; velocity in one frame (1 = a full-speed start from rest, 2 = a full reversal).
burst_level=0.7
burst_threshold=1.3
burst_ms=220

; Rumble level removed while narration is speaking (0 = none, 1 = silenced).
speech_duck=0.6

; Smoothing of the level and cutoff between frames, so quick stick taps do not click.
smooth_ms=12
