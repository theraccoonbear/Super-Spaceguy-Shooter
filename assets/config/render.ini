; render.ini  --  how meshes are drawn (#195). Parsed by CFG_Parse$ (src/sys/config.bas); read by
; GAME_LoadRender (src/sys/game.bas), checked by E3D_OutlineConfig% (src/3d/outline.bas).
; Format: key=value, no spaces around =, ; starts a comment.
;
; Silhouette outline on the player ship, enemies, bosses and asteroids: the edges where a mesh's
; front faces meet its back faces, drawn as lines after the faces and hidden behind nearer meshes.
; Bullets, power-ups and the thruster flame are not outlined.
;
; 1 draws the outline, 0 doesn't
outline=1
; red,green,blue, each 0-255
outline_color=8,8,16
; line thickness in pixels: 1 or 2
outline_width=1
