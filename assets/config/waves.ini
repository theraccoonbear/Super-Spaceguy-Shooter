; waves.ini  --  when and where enemy waves arrive in a combat stage (#90). Parsed by CFG_Parse$
; (src/sys/config.bas); read by src/gameplay/wavetiming.bas, used by src/gameplay/wave.bas and
; enemy.bas. Format: key=value, no spaces around =, ; starts a comment. Times are in frames
; (60 a second).
;
; Per-stage lists give one value per stage 1..6 in order (a stage past the end uses the last
; value). Stage 4 is the asteroid field, which spawns no waves: its entry is never used.
;
; A stage opens fast: its first wave comes almost at once and the next few follow close behind,
; spawning nearer the ship, so the first fight starts within seconds. After the opening, waves
; settle into the regular cadence, which tightens with difficulty (dims.bas DIFF_RAMP_DURATION;
; each stage opens at a higher floor). Boss fights and the asteroid field spawn no waves.
;   wave_first       frames from the start of a combat stage to its first wave
;   wave_open        how many waves, counting the first, make up the stage's opening
;   wave_open_gap    per stage: frames between opening waves. Stages 1-2 are slower, so the
;                    first fight isn't a swarm.
;   wave_open_size   per stage: most fighters in one opening wave (a formation is cut down to
;                    this). Stage 1 opens with lone fighters, stage 2 with pairs at most.
;   wave_gap         frames between later waves: at difficulty 0, at full difficulty
;   wave_gap_pct     per stage: % of wave_gap. The late stages (5-6) press harder, the first
;                    two breathe a little. Stage 1 opens at difficulty 0, stage 6 at 5/6, so the
;                    regular gap at each stage's start is
;                    stage 1 280 x 110% = 308 (5.1 s)   stage 2 267 x 105% = 280 (4.7 s)
;                    stage 3 253 (4.2 s)                stage 5 227 x 80% = 181 (3.0 s)
;                    stage 6 213 x 70% = 149 (2.5 s)
;   wave_fire_pct    per stage: % of an enemy's time between shots (and before its first),
;                    so above 100 fires less often. Stage 1 at 125%: ~2.9-4.8 s between
;                    shots; stage 6 at 70%: ~1.1-1.8 s (was ~1.6-2.5 s).
wave_first=60
wave_open=3
wave_open_gap=210,180,150,150,150,150
wave_open_size=1,2,3,3,3,3
wave_gap=280,200
wave_gap_pct=110,105,100,100,80,70
wave_fire_pct=125,110,100,100,80,70
;
; Spawn distance ahead of the ship (world units; the ship sits at x 0): min,variance.
; Enemies open fire inside 40 ahead (enemy.bas EFIRE_RANGE) and close at ~0.06-0.2 units a
; frame by formation (faster with difficulty), so a stage-1 wave from 70-100 takes ~7.6 s on
; average to come within range; from 55-70 it takes ~3.8 s.
;   wave_open_dist   opening waves
;   wave_dist        later waves
; First enemy within range in stage 1, on average: ~4.8 s (1 s + ~3.8 s); it was ~12.3 s
; (4.7 s + ~7.6 s) before the opening existed.
wave_open_dist=55,15
wave_dist=70,30
;
; Clearing out before a boss or the planet: once the stage's kill target is reached, no new
; waves spawn, the fighters still out there break off and fly out of the playfield (no kill,
; no explosion), and power-ups in flight are pulled in to the ship. The boss warning (or the
; arrival) starts only when the field is empty, the score pop-ups are done and at least
; wave_clear frames have passed; after wave_clear_max frames anything left is removed.
;   wave_clear       frames of clear field, at least
;   wave_clear_max   frames at most
;   wave_retreat     speed a breaking-off fighter climbs away at, units per frame
wave_clear=150
wave_clear_max=360
wave_retreat=0.35
