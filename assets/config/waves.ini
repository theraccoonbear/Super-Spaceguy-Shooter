; waves.ini  --  when and where enemy waves arrive in a combat stage (#90). Parsed by CFG_Parse$
; (src/sys/config.bas); read by src/gameplay/wavetiming.bas, used by src/gameplay/wave.bas.
; Format: key=value, no spaces around =, ; starts a comment. Times are in frames (60 a second).
;
; A stage opens fast: its first wave comes almost at once and the next few follow close behind,
; spawning nearer the ship, so the first fight starts within seconds. After the opening, waves
; settle into the regular cadence, which tightens with difficulty (dims.bas DIFF_RAMP_DURATION;
; each stage opens at a higher floor). Boss fights and the asteroid field spawn no waves.
;   wave_first       frames from the start of a combat stage to its first wave
;   wave_open        how many waves, counting the first, make up the stage's opening
;   wave_open_gap    frames between opening waves
;   wave_gap         frames between later waves: at difficulty 0, at full difficulty
;                    (stage 1 opens at 0, stage 6 at 5/6: 280 -> ~213)
wave_first=60
wave_open=3
wave_open_gap=150
wave_gap=280,200
;
; Spawn distance ahead of the ship (world units; the ship sits at x 0): min,variance.
; Enemies open fire inside 40 ahead (enemy.bas EFIRE_RANGE) and close at ~0.06-0.2 units a
; frame by formation (faster with difficulty), so a stage-1 wave from 70-100 takes ~7.6 s on
; average to come within range; from 55-70 it takes ~3.8 s.
;   wave_open_dist   opening waves
;   wave_dist        later waves
; First enemy within range in stage 1, on average: ~4.8 s (1 s + ~3.8 s); it was ~12.3 s
; (4.7 s + ~7.6 s) before the opening existed.
wave_open_dist=55,15
wave_dist=70,30
