; bosses.ini  --  boss hit points across phases, and the phase-change shield (#90). Parsed by
; CFG_Parse$ (src/sys/config.bas); read by src/gameplay/bosshp.bas, used by boss.bas.
; Format: key=value, no spaces around =, ; starts a comment. Times are in frames (60 a second).
;
; Each boss's hit points are set per fight in assets/sequence.txt (PLAY type=boss ... hp=N); a
; fight with no hp= gets boss_hp_default. One player shot takes 1 HP, a nova pulse 3
; (abilities.ini nova_boss_dmg). Under --nerf a boss has hp x 0.1, at least boss_nerf_min.
; Sizing (#90): live telemetry (real sessions, all at the old 30 HP each) put boss arrival ->
; defeat at boss 1 15-25 s (avg ~19, light upgrades, 6 fights), boss 2 6-12 s (avg ~8, near-max
; upgrades, 5 fights), boss 3 8-15 s (avg ~10, near-max, 5 fights). A shots-per-second model
; from upgrades.ini (60% of shots landing) comes out ~3.5x faster than that (misses, dodging), so
; its times are scaled by 3.5. Scaling the real fights to hp=30/90/130 gives ~19 s, ~22 s and
; ~27-30 s with the phase shields: each later boss a little longer than the one before.
;   boss_hp_default  hit points for a boss fight with no hp=
;   boss_nerf_min    fewest hit points a boss has under --nerf
boss_hp_default=30
boss_nerf_min=3
;
; Phases: phase 2 starts when the boss is down to boss_phase(1)% of its hit points, phase 3 at
; boss_phase(2)% (rounded to the nearest point). A hit can't carry a boss past the next phase's
; start: what's left of it is lost, so every phase is fought, however hard the player hits.
;   boss_phase       phase 2 and phase 3 start at these % of the boss's hit points
boss_phase=66,33
;
; Phase-change shield: when a new phase starts the boss shields itself (shots and nova bounce
; off with a flash) for as long as its phase callout takes to say (assets/gametext.txt
; speech_boss_phase2 / _phase3 at the player's narration speed), plus boss_shield_pad, and never
; less than boss_shield_min. So the boss can't die mid-callout and the arrival never talks over it.
;   boss_shield_pad  frames after the callout ends
;   boss_shield_min  frames at least (also the whole shield when a phase has no callout)
boss_shield_pad=30
boss_shield_min=90
