; upgrades.ini  --  what the upgrade dock sells (#268). Parsed by CFG_Parse$ (src/sys/config.bas);
; read by src/gameplay/upgrades.bas. Format: key=value, no spaces around =, ; starts a comment.
;
; upg_<id>=<name[,name for later levels]>|<price per level>|<effect A, level 0..max>|<effect B, level 0..max>
; upgdesc_<id>=what it does, at most 25 characters (the dock's info line and the SHIP SYSTEMS page;
;   the dock's second line, the next level's change, is worked out from the numbers)
; Nova and roll levels set ability behaviour that lives in abilities.ini (charges, cooldowns).

; laser: A = laser max, B = laser regen per frame
upg_laser=LASER CAPACITOR|80,150,250|100,125,150,180|0.30,0.36,0.42,0.50
upgdesc_laser=BIGGER, FASTER LASER BANK

; cannon: A = shots per trigger pull (2 = parallel pair), B = spread (sideways speed / shot speed)
upg_cannon=TWIN CANNONS,SPREAD SHOT|200,350|1,2,3|0,0,0.08
upgdesc_cannon=MORE SHOTS PER TRIGGER

; rapid: A = seconds between shots
upg_rapid=RAPID FIRE|100,200|0.18,0.14,0.10
upgdesc_rapid=SHORTER DELAY PER SHOT

; shield: A = shield max
upg_shield=SHIELD CAPACITY|80,150,250|100,125,150,180
upgdesc_shield=BIGGER SHIELD (SH)

; regen: A = frames per shield point regained (0 = none), B = frames without a hit before it starts
upg_regen=SHIELD REGEN|120,220|0,20,10|0,180,120
upgdesc_regen=SHIELDS REFILL WHEN UNHIT

; armour: A = collision / asteroid damage multiplier
upg_armour=HULL ARMOUR|100,200|1,0.75,0.5
upgdesc_armour=LESS DAMAGE FROM CRASHES

; nova: charges per level are nova_charges in abilities.ini
upg_nova=NOVA PULSE|150,200,300
upgdesc_nova=Q/Y: CLEARS SHOTS + BLAST

; thrust: A = max sideways speed per frame
upg_thrust=THRUSTERS|60,120|0.12,0.15,0.18
upgdesc_thrust=FASTER SIDEWAYS MOVES

; roll: cooldown per level is roll_cooldown in abilities.ini
upg_roll=EVASIVE ROLL|150,200
upgdesc_roll=E/X: UNTOUCHABLE DASH

; tractor: A = pull range (sideways units), B = pull per frame (fraction of the gap)
upg_tractor=TRACTOR BEAM|60,120|0,10,18|0,0.05,0.09
upgdesc_tractor=PULLS POWER-UPS TO YOU

; fuel: A = fuel tank capacity
upg_fuel=FUEL TANK|50,100|100,130,160
upgdesc_fuel=BIGGER FUEL TANK
