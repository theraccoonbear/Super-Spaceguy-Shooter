; speech.ini  --  the voice's phrase intonation (IN, #236). Parsed by CFG_Parse$ (src/sys/config.bas),
; read by src/audio/speechcfg.bas into speech.bas. Format: key=value, no spaces around =, ; starts a
; comment. A missing key keeps the default in SPK_Init (the values below). Pitches are in semitones.
;
; Pitch is set per word and is flat inside it, so it only changes at a word boundary, as an instant
; step: the voice is a robot announcer, not a singer. Stress is carried by duration and loudness.
;
;   step_semitones        every pitch is a multiple of this (0.25 to 4)
;   declination_per_word  each word of a sentence is this much lower than the one before (0 to 1.5)
;   accent_semitones      the accented words are raised this much (0 to 6)
;   accents_per_phrase    how many words of each clause are accented: the first ones with a primary
;                         stress (0 to 4)
;   final_fall_semitones  the last word before . ! or the end drops this much (0 to 8)
;   rise_semitones        the last word before , ; : lifts this much, before ? 1.5 times as much (0 to 6)
;   stress_pitch_spread   pitch of stressed vowels inside a word: 0 flat, 1 the old 110/130/155 Hz (0 to 1)
;   glide_pitch           1 slides pitch over a formant glide, 0 steps it (0 or 1)
;   liquid_glide          glide into a vowel after L R W Y, times the normal ~28 ms (1 to 3)
;   stress_loudness_db    unstressed vowels this much quieter (0 to 6)
;
; The clarity features of the voice (switches, 1 on / 0 off; all on is the shipped voice):
;
;   feature_glides            formants glide between sounds, no level notch between voiced ones (GL)
;   feature_bursts            stop bursts shaped by place, aspiration, B/D/G release bursts (BU)
;   feature_fricatives        S/Z and SH/ZH/CH/JH as shaped hiss instead of plain noise (FR)
;   feature_nasals_liquids    nasal murmur, liquids slightly below the vowels and glided (NL)
;   feature_bright_tables     harmonics up to about 5 kHz plus a fixed F4 (HB)
;   feature_intonation        phrase pitch: the knobs above only act while this is on (IN)
;
; Live tuning: tools/dev speechtune (a player with scrubbing; S saves this file), or --speech-dev
; in the game (docs/cli.md; / re-reads this file).
step_semitones=1
declination_per_word=0.25
accent_semitones=1.5
accents_per_phrase=1
final_fall_semitones=3
rise_semitones=2
stress_pitch_spread=0
glide_pitch=0
liquid_glide=1
stress_loudness_db=2
feature_glides=1
feature_bursts=1
feature_fricatives=1
feature_nasals_liquids=1
feature_bright_tables=1
feature_intonation=1
