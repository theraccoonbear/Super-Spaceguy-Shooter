; abilities.ini  --  how the active abilities bought at the dock behave (#268). Parsed by
; CFG_Parse$ (src/sys/config.bas); read by src/gameplay/upgrades.bas and abilities.bas.
; Format: key=value, no spaces around =, ; starts a comment. Lists are per upgrade level,
; level 0 (not bought) first, so they need one more entry than upgrades.ini has prices.

; Nova pulse (Q / pad Y): charges per stage by level (refilled at every dock), blast radius
; in world units around the ship, and the hit points a boss loses
nova_charges=0,1,2,3
nova_radius=24
nova_boss_dmg=3

; Evasive roll (E / pad X): cooldown in frames by level (0 = locked), dash length in frames,
; sideways distance per frame
roll_cooldown=0,150,90
roll_frames=20
roll_speed=0.32

; Shown for a few seconds on the first launch after buying the ability
hint_nova=NOVA READY - Q / PAD Y
hint_roll=ROLL READY - E / PAD X
