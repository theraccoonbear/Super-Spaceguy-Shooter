; powerups.ini  --  the power-ups that drift past in combat (#183). Parsed by CFG_Parse$
; (src/sys/config.bas); read by src/gameplay/powerups.bas. Format: key=value, no spaces around =,
; ; starts a comment.
;
; Three kinds, each with its own model and colour: POINTS (gold star), SHIELD (green crystal),
; FUEL (orange canister). None during a boss fight or the asteroid field.
;
; Spawning: every combat wave rolls pup_chance; a hit then picks the kind by pup_weights.
;   pup_chance       chance per combat wave of a power-up (one wave every ~3.3-4.7 s)
;   pup_weights      relative odds of points, shield, fuel (in that order)
pup_chance=0.25
pup_weights=45,40,15
;
; What each kind gives:
;   pup_points       score (score only: power-ups never pay credits)
;   pup_shield       shield points
;   pup_fuel         fuel units per chapter 1..5 (a chapter past the end uses the last value).
;                    Fuel is the economy's lever (see economy.ini), so a fuel pickup is a small
;                    bonus, never a supply line, and it shrinks as fuel gets dearer.
;   pup_overflow_pts score instead, when a shield or fuel pickup finds that gauge already full
; Fuel budget: aim for at most ~5% of a leg's fuel need from pickups. A combat leg of N fuel
; lasts N / 1.1 s, about N x 0.22 waves, so it expects N x 0.22 x 0.25 x 0.15 = N x 0.008 fuel
; pickups. Leg by leg (combat part only; boss and asteroid fields spawn none), if all are caught:
;   leg 1  30 combat of 30 need x 10 = ~2.5  (8%: the first leg, on a full starting tank)
;   leg 2  45 of 45 x  8 = ~2.9  (6%)
;   leg 3  30 of 55 x  6 = ~1.5  (3%)
;   leg 5  45 of 70 x  4 = ~1.5  (2%)    leg 6  60 of 85 x 4 = ~2.0  (2%)
; ~10 fuel over a whole run against ~375 needed (under 3%): it softens a near-miss at a dock
; but never replaces buying fuel.
pup_points=500
pup_shield=30
pup_fuel=10,8,6,5,4
pup_overflow_pts=250
;
; Where they appear and how they move (world units; the ship sits at x 0, the camera behind it):
;   pup_spawn_x      min,variance: spawn this far ahead (45..55), so each one is seen coming
;                    for ~10 s and passes through the tractor beam's reach (45 ahead)
;   pup_spread_y     up to this far above or below the ship
;   pup_spread_z     up to this far to either side (the screen is wider than it is tall)
;   pup_speed        units per frame toward the ship
pup_spawn_x=45,10
pup_spread_y=10
pup_spread_z=14
pup_speed=0.08
;
; Grabbing: a pickup is caught when it passes within pup_grab_dx of the ship along x and within
; pup_grab_r of it across (y and z). Much more forgiving than the hull's box (~0.8 x 0.3 x 0.8):
; flying through the crossing reticle is enough.
;   pup_marker_frames  the reticle shows where it will cross, this many frames before it does
pup_grab_r=1.6
pup_grab_dx=1.2
pup_marker_frames=90
