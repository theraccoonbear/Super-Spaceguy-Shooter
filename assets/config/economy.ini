; economy.ini  --  credits ($), the dock's currency (#268). Parsed by CFG_Parse$ (src/sys/config.bas);
; read by src/gameplay/upgrades.bas. Format: key=value, no spaces around =, ; starts a comment.
; Credits are separate from score: spending them never lowers score.
;
; Credits earned
cr_kill=25
cr_boss=600
cr_stage=200
cr_ast_near=20
cr_ast_kill=20
cr_ast_survive=400
;
; Economy, first pass (#90 tunes it). Only credits earned before the last dock (after
; stage 5) can be spent. A strong run of stages 1-5 earns about:
;   kills        50 x 25  = 1250   (stage triggers 10+15+10+15 kills; stage 4 is the asteroid field)
;   bosses        2 x 600 = 1200   (stage 3 and stage 5 bosses)
;   stage clears  5 x 200 = 1000
;   asteroids    ~15 near misses x 20 + 400 for surviving = 700
;   total                 ~ 4150
; Every level of every upgrade in upgrades.ini costs 3960 in all (95%), fuel and shields not
; counted: those now compete with the upgrades (see Supplies below). The measured full
; god-mode run (71 kills, 3 bosses, 6 stages) earns ~6000 incl. stage 6.
;
; End of a run (win or death): every leftover credit becomes this many score points,
; rounded down (decimals allowed). Added before the high score and the leaderboard post.
credit_bonus_rate=1
;
; Supplies (#277): fuel and shields are bought by the unit at the dock (src/gameplay/supplies.bas).
; Nothing refills them for free any more: not a planet arrival, not a fuel tank upgrade
; (the new capacity arrives empty). Only losing a ship still hands you a full tank, and the
; rare fuel power-up adds 15 units (assets/config/powerups.ini: about 5% of a run on average).
;   fuel_price       credits per fuel unit before the blockade surcharge
;   fuel_mult        surcharge per dock, docks 1..5 in order (dock N = after chapter N; a dock
;                    past the end of the list uses its last value). The Emperor's blockade of the
;                    refinery world only ever tightens, so the list only ever rises.
;                    The dock shows each rise (e.g. +40%) and reads the news behind it, the
;                    dock_news<N> blocks in assets/gametext.txt, which quote these percentages.
;   shield_price     credits per shield point, flat (no surcharge)
;   supply_step_pct  LEFT / RIGHT on a supply row changes the amount by this % of the capacity
; A full 100-unit tank at the last dock costs 100 x 2 x 2.6 = 520, about the price of a big upgrade.
; Buying back each next leg's need (54, 66, 90, 89, 100 fuel; see below) at docks 1-5 costs
;   54x2 + 66x2.8 + 90x3.6 + 89x4.4 + 100x5.2 = 108 + 185 + 324 + 392 + 520 = ~1528,
; about 37% of a strong run's ~4150, so a full set of upgrades no longer fits: every dock is a choice.
fuel_price=2
fuel_mult=1.0,1.4,1.8,2.2,2.6
shield_price=1
supply_step_pct=10
;
; Fuel the next leg needs (the dock's NEXT JUMP NEEDS line, and the stranded check): the leg's
; PLAY tasks in assets/sequence.txt add up, capped at the base tank (100), times NERF_FACTOR
; under --nerf. Rough fit to FUEL_DRAIN (1.1 units/s) on a first pass; #274 calibrates it
; from the fuel_used / seconds the stage_clear telemetry row logs.
;   fuel_per_kill    a combat task needs trigger x this (trigger = the kills that end it)
;   fuel_boss        a boss fight with no fuel= of its own. Each boss line in sequence.txt sets
;                    fuel= (#90), sized from a moderately upgraded player's fight (bosses.ini:
;                    ~19 / ~22 / ~27-30 s), + 2 s of warning and ~1.3 s after the kill, at ~1.3
;                    fuel a second (1.11 base burn, plus thrusting about half the time):
;                    boss 1 ~22 s -> 30, boss 2 ~25 s -> 35, boss 3 ~32 s -> 40
;   fuel_asteroid    the asteroid field: ASTFIELD_DURATION (120 ticks of 40 frames, 4800 frames)
;                    x FUEL_DRAIN 0.0185 = ~89 units burned crossing it; 90 covers it
; Leg needs (chapter: what it holds): 1 36 (12 kills, on the starting tank), 2 54 (18), 3 66
; (12 + boss 1), 4 90 (asteroids), 5 89 (18 + boss 2), 6 100 (20 + boss 3). Every one fits the
; base tank (100), so the stranded check and NEXT JUMP NEEDS never ask for a tank upgrade.
; Chapter 6 holds 20 kills (was 24) to keep it there: its waves come 30% faster (waves.ini), so
; the combat stays as hard, and the fight that got longer is the boss's.
fuel_per_kill=3
fuel_boss=25
fuel_asteroid=90
