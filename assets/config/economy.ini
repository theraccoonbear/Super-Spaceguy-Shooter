; economy.ini  --  credits ($), the dock's currency (#268). Parsed by CFG_Parse$ (src/sys/config.bas);
; read by src/gameplay/upgrades.bas. Format: key=value, no spaces around =, ; starts a comment.
; Credits are separate from score: spending them never lowers score.
;
; Credits earned
cr_kill=25
cr_boss=600
cr_stage=200
cr_ast_near=20
cr_ast_kill=20
cr_ast_survive=400
;
; Economy, first pass (#90 tunes it). Only credits earned before the last dock (after
; stage 5) can be spent. A strong run of stages 1-5 earns about:
;   kills        50 x 25  = 1250   (stage triggers 10+15+10+15 kills; stage 4 is the asteroid field)
;   bosses        2 x 600 = 1200   (stage 3 and stage 5 bosses)
;   stage clears  5 x 200 = 1000
;   asteroids    ~15 near misses x 20 + 400 for surviving = 700
;   total                 ~ 4150
; Every level of every upgrade in upgrades.ini costs 3960 in all (95%), fuel and shields not
; counted: those now compete with the upgrades (see Supplies below). The measured full
; god-mode run (71 kills, 3 bosses, 6 stages) earns ~6000 incl. stage 6.
;
; End of a run (win or death): every leftover credit becomes this many score points,
; rounded down (decimals allowed). Added before the high score and the leaderboard post.
credit_bonus_rate=1
;
; Supplies (#277): fuel and shields are bought by the unit at the dock (src/gameplay/supplies.bas).
; Nothing refills them for free any more: not a planet arrival, not a fuel tank upgrade
; (the new capacity arrives empty). Only losing a ship still hands you a full tank, and the
; rare fuel power-up adds 15 units (assets/config/powerups.ini: about 4% of a run on average).
;   fuel_price       credits per fuel unit before the blockade surcharge
;   fuel_mult        surcharge per dock, docks 1..5 in order (dock N = after chapter N; a dock
;                    past the end of the list uses its last value). The Emperor's blockade of the
;                    refinery world only ever tightens, so the list only ever rises.
;                    The dock shows each rise (e.g. +40%) and reads the news behind it, the
;                    dock_news<N> blocks in assets/gametext.txt, which quote these percentages.
;   shield_price     credits per shield point, flat (no surcharge)
;   supply_step_pct  LEFT / RIGHT on a supply row changes the amount by this % of the capacity
; Mileage is honest (see below); the squeeze is the price. A full 100-unit tank at the last dock
; costs 100 x 1.6 x 2.6 = 416, a 160 tank 666. Buying back each next leg's honest need (107, 109,
; 122, 90, 107 fuel; see below) at docks 1-5 costs
;   107x1.6 + 109x2.24 + 122x2.88 + 90x3.52 + 107x4.16 = 171 + 244 + 351 + 317 + 445 = ~1528,
; plus the first fuel tank upgrade (50) the longer legs call for: ~1580, about 38% of a strong
; run's ~4150, so a full set of upgrades doesn't fit: every dock is a choice. (At the old
; fuel_price of 2 the same legs would cost ~1905, 46%.)
fuel_price=1.6
fuel_mult=1.0,1.4,1.8,2.2,2.6
shield_price=1
supply_step_pct=10
;
; Fuel the next leg needs (the dock's NEXT JUMP NEEDS line, and the stranded check), an honest
; estimate a typical player can win with: the leg's expected seconds in play (its PLAY tasks in
; assets/sequence.txt) x fuel_burn x fuel_margin, times NERF_FACTOR under --nerf. Never capped:
; a leg longer than the tank says so at the dock (UPGRADE TANK), and the stranded check only asks
; for what the tank can hold, min(need, tank). Running dry mid-leg drifts, and losing a ship
; refills the tank, so a run without the tank upgrade is possible, just painful.
;   fuel_burn        fuel a second in play. Telemetry (#90, real sessions, stage_clear fuel_used
;                    over time): ~1.32 on every stage, against the 1.11 base drain: typical
;                    manoeuvring (thrusting drains extra) adds ~19%.
;   fuel_margin      x this on top. 1.15: telemetry's spread between players runs from x1.15
;                    (chapter 3, max 99 vs avg 86) up to x1.7 for first-chapter learners (max 97
;                    vs avg 57). 1.15 covers a few misses and an extra dodge; a bigger margin
;                    would strand players at the dock on legs they'd have finished, and the
;                    worst runs still have pickups, the reserve and a refilled tank if a ship is lost.
;   fuel_kill_secs   per chapter 1..6: seconds of combat per kill the stage asks for, opening and
;                    clear-out included (chapter 4 is the asteroid field: unused). From telemetry
;                    (fuel_used / 1.32, stage targets then ~10/15/10/15/20, boss time taken
;                    off: ch1 4.3, ch2 3.8, ch3 4.3 s a kill), then the #90 tuning (stage 1 waves
;                    10% further apart, stage 2 5%, first contact ~5-8 s sooner, +3 s clear-out):
;                    ch1 4.4, ch2 3.9, ch3 4.1. Chapters 5-6 telemetry came from near-max
;                    upgrades (2.0 / 1.35 s a kill); a typical player kills ~70% of what the
;                    denser waves bring (~0.9 / ~1.1 fighters a second): ch5 1.9, ch6 1.6.
;   fuel_boss_secs   a boss fight with no secs= of its own. Each boss line in sequence.txt sets
;                    secs= (#90): the fight (bosses.ini: ~19 / ~22 / ~28 s) + 2 s of warning +
;                    ~1.3 s after the kill: 22, 25, 32.
;   fuel_asteroid_secs  the asteroid field: ASTFIELD_DURATION, 4800 frames = 80 s
; Leg needs (chapter: seconds -> fuel): 1 12 kills 53 s -> 81 (on the starting tank), 2 18 kills
; 70 s -> 107, 3 12 kills + boss 1 71 s -> 109, 4 asteroids 80 s -> 122, 5 18 kills + boss 2
; 59 s -> 90, 6 24 kills + boss 3 70 s -> 107. Chapters 2, 3, 4 and 6 need more than the base
; tank (100): the first fuel tank upgrade (130) covers every leg.
fuel_burn=1.32
fuel_margin=1.15
fuel_kill_secs=4.4,3.9,4.1,4.1,1.9,1.6
fuel_boss_secs=25
fuel_asteroid_secs=80
